# Local stack: Postgres + Azurite + API (.NET).
# Optional integrations (Stripe, Azure Blob, email) stay off unless you supply
# their values — copy .env.example to .env and fill in what you need.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: picknic
      POSTGRES_USER: picknic
      POSTGRES_PASSWORD: picknic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picknic -d picknic"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local Azure Blob Storage emulator — stands in for real Blob Storage so the
  # photo upload/gallery flow works without an Azure account.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --disableTelemetry
    ports:
      - "10000:10000"
    volumes:
      - azurite:/data

  dpkeys-init:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    user: root
    command: sh -c 'mkdir -p /keys && chown -R 1654:1654 /keys'
    volumes:
      - dpkeys:/keys

  api:
    build: ./api
    ports:
      # Host 8080 (not 5000 — macOS AirPlay Receiver hijacks 5000).
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Database=picknic;Username=picknic;Password=picknic"
      # Photo storage via the Azurite emulator (account-key SAS). PublicEndpoint
      # rewrites SAS URLs so clients can reach the emulator; {host} becomes the
      # hostname the client called the API on (localhost, LAN IP, …).
      Storage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      Storage__PublicEndpoint: "http://{host}:10000/devstoreaccount1"
      # Optional — leave unset to run without these integrations.
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Email__ConnectionString: ${EMAIL_CONNECTION_STRING:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
    volumes:
      - dpkeys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      dpkeys-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  azurite:
  dpkeys:
