packages:
  - app
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  vue-demi: true
patchedDependencies:
  vue-lynx@0.4.0: patches/vue-lynx@0.4.0.patch
minimumReleaseAgeExclude:
  - '@vyui/core'
  - '@vyui/kit'
  # Local tarball in app/vendor, not on the npm registry — age can't be checked.
  - '@kealanau/lynx-camera'
